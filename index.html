<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#F8F8E7;color:#1B2335}img{max-width:100%}@media (prefers-color-scheme:dark){body{background:#12151C;color:#E7E9EE}}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>감리교 성경문제집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F8F8E7; --surface:#FFFFFF; --sunk:#EDEDD8; --ink:#1B2335; --ink2:#4A5263; --ink3:#7A8090;
  --line:#DCDCC6; --red:#B3261E; --red-bg:#F8E7E4; --gold:#8E6B24; --gold-bg:#F2EAD6;
  --ok:#2F6B47; --ok-bg:#E3F0E7; --navy:#1B2335; --on-navy:#F8F8E7; --focus:#3B5BA9;
  --serif:"Gowun Batang","AppleMyungjo","Nanum Myeongjo",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --ground:#12151C; --surface:#1A1F29; --sunk:#222835; --ink:#E7E9EE; --ink2:#B4BAC6; --ink3:#868D9B;
  --line:#2E3543; --red:#FF7A6E; --red-bg:#3A1E1D; --gold:#D8B56E; --gold-bg:#33291A;
  --ok:#7CC796; --ok-bg:#1B3226; --navy:#E7E9EE; --on-navy:#12151C; --focus:#8FA8FF;}}
:root[data-theme="dark"]{
  color-scheme:dark; --ground:#12151C; --surface:#1A1F29; --sunk:#222835; --ink:#E7E9EE; --ink2:#B4BAC6; --ink3:#868D9B;
  --line:#2E3543; --red:#FF7A6E; --red-bg:#3A1E1D; --gold:#D8B56E; --gold-bg:#33291A;
  --ok:#7CC796; --ok-bg:#1B3226; --navy:#E7E9EE; --on-navy:#12151C; --focus:#8FA8FF;}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding-inline:18px;padding-block:20px 48px;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--ink3);font-weight:600}
h1{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.25;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--red)}
h2{font-size:13px;letter-spacing:.06em;color:var(--ink2);font-weight:600;margin:0}
.muted{color:var(--ink3)}
.num{font-variant-numeric:tabular-nums}

/* masthead */
.mast{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:12px 4px;display:flex;flex-direction:column;gap:2px}
.stat+.stat{border-left:1px solid var(--line);padding-left:14px}
.stat b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--ink3)}

/* testament switch */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:10px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:7px;padding:10px;font-weight:600;color:var(--ink2);display:flex;justify-content:center;gap:8px;align-items:baseline}
.seg button small{font-weight:400;color:var(--ink3);font-size:12px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* thumb index */
.index{display:flex;flex-direction:column;gap:16px}
.group{display:flex;flex-direction:column;gap:8px}
.group-h{display:flex;justify-content:space-between;align-items:baseline}
.group-h button{border:0;background:none;color:var(--ink3);font-size:12px;padding:2px 0}
.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.tab{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:6px 6px 3px 3px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:0;overflow:hidden;text-align:left}
.tab .ab{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.2}
.tab .nm{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--ink3);opacity:.5}
.tab .cnt{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.tab[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.tab[aria-pressed="true"] .nm,.tab[aria-pressed="true"] .cnt{color:var(--on-navy);opacity:.75}
.tab[aria-pressed="true"] .bar{background:var(--on-navy)}

/* options */
.opts{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 13px;background:var(--surface);font-size:14px;cursor:pointer;user-select:none}
.chip input{position:absolute;opacity:0;pointer-events:none}
.numchip{padding-block:4px;gap:6px}
.numchip input[type="number"]{position:static;opacity:1;pointer-events:auto;width:4.2em;border:1px solid var(--line);border-radius:6px;background:var(--ground);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums;padding:3px 6px;text-align:right;-moz-appearance:textfield}
.numchip input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none}
.chip:has(input[type="radio"]:checked) input[type="number"]{background:var(--ground);color:var(--ink);border-color:var(--ground)}
.chip:has(input:checked){border-color:var(--ink);background:var(--ink);color:var(--ground)}
.chip .n{font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}

.start{display:flex;gap:10px;align-items:center;position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--ground) 30%)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:13px 18px;font-weight:600}
.btn.primary{background:var(--navy);color:var(--on-navy);border-color:var(--navy);flex:1}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px dashed var(--line);border-radius:10px;padding:12px 14px}

/* quiz */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--ground);display:flex;flex-direction:column;gap:8px;padding-block:10px 4px}
.qbar-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.icon-btn{border:0;background:none;padding:6px 2px;color:var(--ink2);font-size:14px;font-weight:500}
.progress{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);transition:width .25s}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--ink3)}
.badge{display:inline-block;font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 7px;letter-spacing:.02em}
.badge.gold{background:var(--gold-bg);color:var(--gold)}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.plain{background:var(--sunk);color:var(--ink2)}
.qtext{font-family:var(--serif);font-size:19px;line-height:1.7;margin:0;text-wrap:pretty;word-break:keep-all}
.qtext .qn{font-family:var(--sans);font-weight:600;color:var(--ink3);font-size:15px;margin-right:6px;font-variant-numeric:tabular-nums}
.verse{font-family:var(--serif);font-size:17px;line-height:1.9;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin:0;white-space:pre-wrap;word-break:keep-all}
.lines{display:flex;flex-direction:column;gap:4px;font-family:var(--serif);font-size:16.5px;line-height:1.75;word-break:keep-all}
.blank{display:inline-block;min-width:3.5em;border-bottom:1.5px solid var(--ink3);color:transparent;text-align:center;line-height:1.3;user-select:none}
.shown .blank{color:var(--red);border-bottom-color:var(--red);user-select:text;font-weight:700}
.redtx{color:transparent;background:var(--sunk);border-radius:3px}
.shown .redtx{color:var(--red);background:transparent;font-weight:700}
.choices{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.choice{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:13px 14px;font-size:16px;line-height:1.5;word-break:keep-all}
.choice .k{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink3);display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--ink2);margin-top:1px}
.choice:hover:not(:disabled){border-color:var(--ink2)}
.choice.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.choice.sel .k{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--ok);background:var(--ok-bg)}
.choice.right .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.choice.wrong{border-color:var(--red);background:var(--red-bg)}
.choice.wrong .k{background:var(--red);border-color:var(--red);color:var(--surface)}
.choice.static{cursor:default}
.answer{border-left:3px solid var(--red);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:4px}
.answer .lbl{font-size:12px;font-weight:600;color:var(--red);letter-spacing:.06em}
.answer .val{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--ink);word-break:keep-all}
.tip{font-size:14px;color:var(--ink2);background:var(--sunk);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tip b{font-size:12px;color:var(--ink3);letter-spacing:.06em}
.verdict{font-weight:700;font-size:15px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--red)}
.actions{display:flex;gap:8px;position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--ground) 30%)}
.actions .btn{flex:1}
.btn.okb{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.btn.nob{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.qbody{display:flex;flex-direction:column;gap:16px}
.hint{font-size:13px;color:var(--ink3)}

/* results */
.score{font-family:var(--serif);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:22px;color:var(--ink3)}
.rlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ritem{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.ritem .mk{flex:none;width:18px;font-weight:700}
.ritem .mk.ok{color:var(--ok)} .ritem .mk.no{color:var(--red)}
.ritem .t{flex:1;word-break:keep-all}
.ritem .src{flex:none;color:var(--ink3);font-size:12px}
.foot{font-size:12px;color:var(--ink3);text-align:center}
.foot button{border:0;background:none;color:var(--ink3);text-decoration:underline;font-size:12px}
.nav{display:flex;gap:18px;border-bottom:1px solid var(--line)}
.nav button{border:0;background:none;padding:6px 0 10px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.seg3{grid-template-columns:repeat(3,1fr)}
.vlist{display:flex;flex-direction:column}
.vsec{font-size:13px;letter-spacing:.06em;color:var(--ink2);font-weight:600;padding:18px 0 6px;border-bottom:1px solid var(--ink)}
.verseitem{display:flex;flex-direction:column;gap:8px;padding:16px 0;border-bottom:1px solid var(--line)}
.vhead{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.vref{font-weight:700;font-size:16px}
.vnum{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.vhead .mark{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:12px;padding:3px 10px;color:var(--ink3)}
.vhead .mark[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:600}
.vtext{display:flex;flex-direction:column;gap:2px;font-family:var(--serif);font-size:17px;line-height:1.75;word-break:keep-all;margin:0;padding:0;list-style:none}
.vtext .vp{margin:0}
.vtext .ln{flex:none;width:1.4em;font-family:var(--sans);font-size:11px;color:var(--ink3);padding-top:.45em;text-align:right;font-variant-numeric:tabular-nums}
.vtext .vv{font-family:var(--sans);font-size:11px;font-weight:700;color:var(--red);margin-right:4px;vertical-align:.35em}
.vtext .tx{flex:1}
.cover{border:0;background:var(--sunk);border-radius:4px;color:transparent;text-align:left;padding:0 6px;font:inherit;line-height:inherit;cursor:pointer;width:100%}
.cover.open{background:transparent;color:inherit;padding:0;cursor:default}
.sw{font-weight:700}
.cover.rest{display:inline;width:auto;padding:0 .4em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.cover.rest:not(.open){display:inline;line-height:2}
.cover.rest.open{display:inline;padding:0}
details.fix{font-size:13px;color:var(--ink2)}
details.fix summary{cursor:pointer;color:var(--gold);font-weight:600;font-size:12.5px}
details.fix ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
details.fix s{color:var(--ink3)}
details.fix b{color:var(--red)}
.vtips{font-size:13.5px;color:var(--ink2);display:flex;flex-direction:column;gap:2px}
.cardref{font-family:var(--serif);font-size:28px;font-weight:700;line-height:1.3}
.cue{font-family:var(--serif);font-size:17px;color:var(--ink2)}
.bin{font:inherit;font-family:var(--sans);font-size:.92em;color:var(--ink);background:var(--surface);border:0;border-bottom:1.5px solid var(--ink2);border-radius:3px 3px 0 0;padding:1px 4px;text-align:center;max-width:100%;min-width:3em}
.bin:focus{outline:none;background:var(--sunk);border-bottom-color:var(--focus)}
.bin.right{border-bottom-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.bin.wrong{border-bottom-color:var(--red);color:var(--ink3);background:var(--red-bg);text-decoration:line-through}
.redans{color:var(--red);font-weight:700}
.fixans{margin-left:4px}
.ansrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 6px 6px 14px}
.ansrow:focus-within{border-color:var(--ink);outline:none}
.ansrow span{font-size:13px;font-weight:600;color:var(--ink3)}
.ansinput{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);padding:8px 4px}
.ansinput:focus{outline:none}
.ansinput.right{color:var(--ok);font-weight:600}
.ansinput.wrong{color:var(--red);text-decoration:line-through}
.ansbox{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px 14px;font-family:var(--serif);font-size:17px;line-height:1.8;resize:vertical}
.ansbox:focus{outline:none;border-color:var(--ink)}
.cmp{display:flex;flex-direction:column;gap:6px}
.cmp-h{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--ink3)}
.mine{font-family:var(--serif);font-size:16.5px;line-height:1.8;margin:0;white-space:pre-wrap;word-break:keep-all}
mark.miss{background:var(--red-bg);color:var(--red);font-weight:700;border-radius:2px}
mark.extra{background:var(--gold-bg);color:var(--gold);font-weight:700;border-radius:2px;text-decoration:line-through}
.cue b{color:var(--ink)}
.statbtn{border:0;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer;border-radius:0}
.statbtn:hover b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.statbtn span{white-space:nowrap}
details.rvi{border-bottom:1px solid var(--line)}
details.rvi summary{list-style:none;display:flex;gap:10px;padding:12px 0;cursor:pointer;align-items:baseline}
details.rvi summary::-webkit-details-marker{display:none}
details.rvi summary .mk{flex:none;width:18px;font-weight:700}
details.rvi summary .mk.ok{color:var(--ok)} details.rvi summary .mk.no{color:var(--red)}
details.rvi summary .t{flex:1;word-break:keep-all;font-size:14.5px}
details.rvi summary .src{flex:none;font-size:12px;color:var(--ink3)}
details.rvi[open] summary .t{font-weight:600}
.rvd{display:flex;flex-direction:column;gap:12px;padding:0 0 16px 28px}
.rvd .verse{font-size:15.5px}
.rvd .choice{font-size:14.5px;padding:9px 12px}
.myans{font-size:14px;color:var(--ink2);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.myans b{font-size:12px;color:var(--ink3);letter-spacing:.06em}
.myans .v{font-family:var(--serif)}
.myans .v.no{color:var(--red);text-decoration:line-through}
.myans .v.ok{color:var(--ok)}
.rvd .actrow{display:flex;gap:8px}
.rvd .actrow .btn{padding:8px 14px;font-size:13.5px}
.years{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:var(--gold-bg);border-radius:10px}
.years-h{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--gold)}
.years .chip .n{font-size:11px}
.mixr{display:inline-flex;flex-wrap:wrap;gap:8px}
.numchip input.bookin{position:static;opacity:1;pointer-events:auto;width:6.5em;border:1px solid var(--line);border-radius:6px;background:var(--ground);color:var(--ink);font:inherit;padding:3px 6px;text-align:center}
#mix-row[hidden]{display:none!important}
.sthead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:8px}
.sthead h2{font-family:var(--serif);font-size:24px;letter-spacing:0;color:var(--ink);font-weight:700}
.sthead span{font-size:13px;color:var(--ink3)}
.sti{display:flex;flex-direction:column;gap:10px;padding:18px 0;border-bottom:1px solid var(--line)}
.sti .qtext{font-size:17px}
.sti .qtext .qn{font-size:13px}
.sti .verse{font-size:16px}
.sti .choice{font-size:15px;padding:9px 12px}
.sti.closed .redans{color:transparent;background:var(--sunk);border-radius:3px}
.sti.closed .choice.right{border-color:var(--line);background:var(--surface)}
.sti.closed .choice.right .k{background:transparent;border-color:var(--ink3);color:var(--ink2)}
.sti.closed .answer,.sti.closed .tip{display:none}
.sti .peek{align-self:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:600;color:var(--ink2)}
.sti:not(.closed) .peek{display:none}
.stsec{font-size:13px;letter-spacing:.06em;color:var(--red);font-weight:600;padding:22px 0 6px;border-bottom:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="home">
  <nav class="nav" aria-label="메뉴"><button aria-current="page">문제풀이</button><button data-go="study">학습</button><button data-go="mem">암송</button></nav>
  <header class="mast">
    <h1>감리교 <em>성경문제집</em></h1>
  </header>
  <div class="stats" id="stats"></div>
  <div class="resume" id="resume" hidden></div>
  <div class="seg" role="group" aria-label="구약/신약">
    <button id="seg-ot" data-t="ot" aria-pressed="true">구약 <small id="cnt-ot"></small></button>
    <button id="seg-nt" data-t="nt" aria-pressed="false">신약 <small id="cnt-nt"></small></button>
  </div>
  <section class="index" id="index" aria-label="책 선택"></section>
  <section class="group">
    <h2>풀 문제</h2>
    <div class="opts" id="filters">
      <label class="chip"><input type="radio" name="f" id="f-all" value="all" checked>전체</label>

    const gs = {}; list.forEach(q=>(gs[groupOf(q)] ||= []).push(q));
    const lanes = shuffle(Object.values(gs)), out = [];
    for (let i=0; out.length<list.length; i++) for (const l of lanes) if (l[i]) out.push(l[i]);

  });

  renderQ();
}
$("q-prev").onclick = ()=>{ if(sess.i>0){ sess.i--; store.set("sess",sess); renderQ(); } };
$("q-home").onclick = ()=>{ show("home"); };
document.addEventListener("keydown", e=>{
  if ($("quiz").hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName) && !document.activeElement.readOnly) return;
  const n = parseInt(e.key,10);
  if (n>=1 && n<=9){ const b = $("qbody").querySelector(`.choice[data-i="${n-1}"]`); if (b && !b.disabled) b.click(); }
  if (e.key==="Enter"){ const b = $("next")||$("chk"); if (b && !b.disabled){ e.preventDefault(); b.click(); } }
});

/* ---------- result ---------- */
function showResult(){
  const ids = sess.ids.filter(id=>sess.res[id]!==undefined);
  const ok = ids.filter(id=>sess.res[id]===1).length;
  $("r-eyebrow").textContent = sess.label;
  $("r-score").innerHTML = `${ok}<small> / ${ids.length}</small>`;
  $("r-sub").textContent = ids.length ? `정답률 ${Math.round(ok/ids.length*100)}%` : "푼 문제가 없습니다";
  const wrong = ids.filter(id=>sess.res[id]===0);
  $("r-retry").hidden = !wrong.length;
  $("r-retry").onclick = ()=>{ sess = {ids:wrong, i:0, res:{}, label:"방금 틀린 문제"}; store.set("sess",sess); show("quiz"); renderQ(); };
  $("r-list").innerHTML = ids.map(id=>{ const q=ALL[id], r=sess.res[id];
    return `<div class="ritem"><span class="mk ${r?"ok":"no"}">${r?"○":"✕"}</span><span class="t">${rich(q.q).replace(/<span class="blank">.*?<\/span>/g,"     ")}</span><span class="src">${q.k==="mem"?"암송":DATA.books[q.b]}</span></div>`; }).join("");
  sess = null; store.set("sess",null);
  show("result");
}
$("r-home").onclick = ()=>show("home");

/* ---------- 풀이 기록 ---------- */
const rv = {f:"all"};
const RVTITLE = {all:"푼 문제", right:"맞은 문제", wrong:"틀린 문제"};
function idOrder(id){ const q = ALL[id]; const g = q.k==="mem" ? 2 : q.t==="ot" ? 0 : 1;
  return g*100000 + (q.k==="mem" ? MEM.indexOf(q.m) : q.no); }
function reviewIds(){
  const t = document.querySelector('input[name="rvt"]:checked').value;
  return Object.keys(rec).filter(id=>ALL[id] && (rv.f==="all" || (rv.f==="right" ? rec[id]===1 : rec[id]===0)))
    .filter(id=>{ const q=ALL[id]; return t==="all" || (t==="mem" ? q.k==="mem" : q.k!=="mem" && q.t===t); })
    .sort((a,b)=>idOrder(a)-idOrder(b));
}
function myAnswerText(q, a){
  if (!a) return null;
  if (a.p) return a.p.length ? a.p.map(i=>`${i+1}번 ${q.o[i][0]}`).join(", ") : "(선택 안 함)";
  if (a.b) return a.b.map(x=>x||"(빈칸)").join(" / ");
  if (a.t!==undefined) return a.t.trim() || "(비어 있음)";
  return null;
}
function reviewDetail(q){
  const ok = rec[q.id]===1, mine = myAnswerText(q, lastAns[q.id]);
  let h = "";
  if (q.k==="mem"){
    h += `<div class="cardref" style="font-size:20px">${esc(q.m.ref)}</div>${vlines(q.m,"full")}`;
  } else {
    h += `<p class="qtext" style="font-size:16.5px">${rich(q.q,"answer")}</p>`;
    (q.L||[]).forEach(l=>{ const v = /^\s*[“"]/.test(l) || /\{\{\(/.test(l);
      h += v ? `<p class="verse">${rich(l.trim(),"answer")}</p>` : `<div class="lines">${rich(l,"answer")}</div>`; });
    if (q.o){ const picked = new Set((lastAns[q.id]||{}).p||[]);
      h += `<ul class="choices">` + q.o.map((o,i)=>`<li><div class="choice static${o[1]?" right":picked.has(i)?" wrong":""}"><span class="k">${i+1}</span><span>${esc(o[0])}</span></div></li>`).join("") + `</ul>`; }
    if (q.a) h += `<div class="answer"><span class="lbl">정답</span><span class="val">${esc(q.a)}</span></div>`;
  }
  if (mine!==null && !(q.k==="mc")) h += `<div class="myans"><b>내 답</b><span class="v ${ok?"ok":"no"}">${esc(mine)}</span></div>`;
  const tip = q.k==="mem" ? q.m.tip : q.tip;
  if (tip) h += `<div class="tip"><b>${q.k==="mem"?"외우는 요령":"메모"}</b>${tip.map(esc).join("<br>")}</div>`;
  h += `<div class="actrow"><button class="btn" data-redo="${q.id}">이 문제 다시 풀기</button>` +
       (ok ? "" : `<button class="btn" data-ok="${q.id}">정답으로 처리</button>`) + `</div>`;
  return h;
}
function renderReview(){
  $("rv-title").textContent = RVTITLE[rv.f];
  $("rv-tabs").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.f===rv.f));
  const ids = reviewIds();
  $("rv-count").textContent = `${ids.length.toLocaleString()}문제`;
  let h = "", sec = "";
  for (const id of ids){
    const q = ALL[id], k = q.k==="mem" ? "암송" : q.t==="ot" ? "구약" : "신약";
    if (k!==sec){ sec=k; h += `<div class="vsec">${k}</div>`; }
    const title = q.k==="mem" ? `${q.m.ref} 암송` : rich(q.q).replace(/<span class="blank"><\/span>/g,"\u2003\u2003");
    h += `<details class="rvi" data-id="${id}"><summary><span class="mk ${rec[id]?"ok":"no"}">${rec[id]?"○":"✕"}</span><span class="t">${title}</span><span class="src">${q.k==="mem"?ABBR[q.m.book]||"":DATA.books[q.b]}</span></summary><div class="rvd"></div></details>`;
  }
  $("rv-list").innerHTML = h || `<p class="muted">${rv.f==="wrong"?"틀린 문제가 없습니다.":"아직 푼 문제가 없습니다."}</p>`;
  $("rv-act").innerHTML = ids.length ? `<button class="btn primary" id="rv-go">${RVTITLE[rv.f]} ${ids.length.toLocaleString()}개 다시 풀기</button>` : "";
  if (ids.length) $("rv-go").onclick = ()=>startSession(ids, `${RVTITLE[rv.f]} 다시 풀기`);
}
function startSession(ids, label){ sess = {ids, i:0, res:{}, label}; store.set("sess",sess); show("quiz"); renderQ(); }
$("rv-list").addEventListener("toggle", e=>{
  const d = e.target; if (!d.open || d.dataset.filled) return;
  d.querySelector(".rvd").innerHTML = reviewDetail(ALL[d.dataset.id]); d.dataset.filled = 1;
}, true);
$("rv-list").addEventListener("click", e=>{
  const r = e.target.closest("[data-redo]"); if (r){ startSession([r.dataset.redo], "다시 풀기"); return; }
  const o = e.target.closest("[data-ok]"); if (o){ const q = ALL[o.dataset.ok]; rec[q.id]=1; store.set("rec",rec);
    if (q.k==="mem"){ memrec[q.m.id]=1; store.set("mem",memrec); } renderReview(); }
});
$("rv-tabs").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; rv.f=b.dataset.f; renderReview(); };
document.querySelectorAll('input[name="rvt"]').forEach(r=>r.onchange=renderReview);
$("rv-back").onclick = ()=>show("home");

/* ---------- 학습 ---------- */
const st = Object.assign({t:"ot", b:0, show:true}, store.get("st", {}));
function studyQs(){
  const f = document.querySelector('input[name="sf"]:checked').value;
  const keep = q => q.b===st.b && (f==="all" || (f==="past" ? q.y : rec[q.id]===0));
  return {qs: DATA[st.t].filter(keep), ms: MEMQ[st.t].filter(keep)};
}
function studyItem(q, n){
  let h = `<article class="sti${st.show?"":" closed"}" data-id="${q.id}">`;
  if (q.k==="mem"){
    h += `<div class="vhead"><span class="vref">${esc(q.m.ref)}</span></div>`;
    h += st.show ? vlines(q.m,"full") : vlines(q.m,"start");
    if (q.m.tip) h += `<div class="tip"><b>외우는 요령</b>${q.m.tip.map(esc).join("<br>")}</div>`;
  } else {
    h += `<p class="qtext"><span class="qn">${n}</span>${rich(q.q,"answer")}</p>`;
    (q.L||[]).forEach(l=>{ const v = /^\s*[“"]/.test(l) || /\{\{\(/.test(l);
      h += v ? `<p class="verse">${rich(l.trim(),"answer")}</p>` : `<div class="lines">${rich(l,"answer")}</div>`; });
    if (q.o) h += `<ul class="choices">` + q.o.map((o,i)=>`<li><div class="choice static${o[1]?" right":""}"><span class="k">${i+1}</span><span>${esc(o[0])}</span></div></li>`).join("") + `</ul>`;
    if (q.a) h += `<div class="answer"><span class="lbl">정답</span><span class="val">${esc(q.a)}</span></div>`;
    if (q.tip) h += `<div class="tip"><b>메모</b>${q.tip.map(esc).join("<br>")}</div>`;
  }
  h += `<button class="peek">정답 보기</button></article>`;
  return h;
}
function renderStudy(){
  $("st-seg").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.t===st.t));
  $("st-show").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", (b.dataset.s==="1")===st.show));
  const cnt = {}; DATA[st.t].forEach(q=>cnt[q.b]=(cnt[q.b]||0)+1);
  if (!cnt[st.b]) st.b = +Object.keys(cnt)[0];
  $("st-index").innerHTML = GROUPS[st.t].map(([g,a,z])=>{
    const tabs = []; for (let b=a;b<=z;b++){ if(!cnt[b]) continue; const nm = DATA.books[b];
      tabs.push(`<button class="tab" data-b="${b}" aria-pressed="${b===st.b}" title="${nm}"><span class="ab">${ABBR[nm]}</span><span class="nm">${nm}</span><span class="cnt">${cnt[b]}문제</span></button>`); }
    return `<div class="group"><div class="group-h"><h2>${g}</h2></div><div class="tabs">${tabs.join("")}</div></div>`;
  }).join("");
  const {qs, ms} = studyQs();
  $("st-head").innerHTML = `<h2>${DATA.books[st.b]}</h2><span>문제 ${qs.length}${ms.length?` · 암송 ${ms.length}`:""}</span>`;
  let h = qs.map((q,i)=>studyItem(q,i+1)).join("");
  if (ms.length) h += `<div class="stsec">${DATA.books[st.b]} 암송 구절</div>` + ms.map(q=>studyItem(q)).join("");
  $("st-list").innerHTML = h || `<p class="muted">조건에 맞는 문제가 없습니다.</p>`;
  $("st-act").innerHTML = qs.length+ms.length ? `<button class="btn primary" id="st-go">${DATA.books[st.b]} ${qs.length+ms.length}문제 풀기</button>` : "";
  if ($("st-go")) $("st-go").onclick = ()=>startSession(qs.concat(ms).map(q=>q.id), `${DATA.books[st.b]} 학습 후 풀기`);
  store.set("st", st);
}
$("st-seg").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; st.t=b.dataset.t; st.b=-1; renderStudy(); window.scrollTo(0,0); };
$("st-show").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; st.show = b.dataset.s==="1"; renderStudy(); };
$("st-index").onclick = e=>{ const b=e.target.closest(".tab"); if(!b) return; st.b=+b.dataset.b; renderStudy();
  $("st-head").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"}); };
document.querySelectorAll('input[name="sf"]').forEach(r=>r.onchange=renderStudy);
$("st-list").onclick = e=>{ const p=e.target.closest(".peek"); if(!p) return; const it=p.closest(".sti"); it.classList.remove("closed");
  const q = ALL[it.dataset.id]; if (q.k==="mem"){ const ol = it.querySelector(".vtext"); ol.outerHTML = vlines(q.m,"full"); } };

function show(v){
  for (const s of ["home","quiz","result","mem","card","review","study"]) $(s).hidden = s!==v;
  if (v==="study") renderStudy();
  if (v==="review") renderReview();
  if (v==="home"){ renderStats(); renderIndex(); }
  if (v==="mem") renderMem();
  ui.view = (v==="mem"||v==="card") ? "mem" : v==="study" ? "study" : "home"; store.set("ui",ui);
  window.scrollTo(0,0);
}

/* ---------- 암송 ---------- */
let mui = store.get("mui", {mode:"full", rnd:false}); if (mui.mode==="init") mui.mode="start";
const SECT = {"ot1":"구약 · 1절","ot2":"구약 · 2절 이상","nt1":"신약 · 1절","nt2":"신약 · 2절 이상"};
const MODEHINT = {full:"개역개정 본문을 그대로 봅니다.", start:"절마다 시작 단어만 보입니다. 이어지는 말씀을 떠올린 뒤 가려진 부분을 눌러 확인하세요.", hide:"가려진 부분을 누르면 하나씩 열립니다."};
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));
function startWord(t, i){ const k = t.indexOf(" "); if (k<0) return `<span class="sw">${esc(t)}</span>`;
  return `<span class="sw">${esc(t.slice(0,k))}</span> <span class="cover rest" role="button" tabindex="0" aria-label="${i+1}번째 부분 열기">${esc(t.slice(k+1))}</span>`; }
// 줄 번호 없이, 한 절 안의 줄은 이어 쓰고 절이 바뀔 때만 줄을 바꾼다
function verseGroups(r){
  const g = []; r.L.forEach((x,i)=>{ if (!g.length || x.v) g.push({v:x.v, items:[]}); g[g.length-1].items.push([x,i]); }); return g;
}
function verseText(r){ return verseGroups(r).map(g=>g.items.map(([x])=>x.t).join(" ")).join("\n"); }
function vlines(r, mode){
  return `<div class="vtext">` + verseGroups(r).map(g=>{
    const vv = g.v ? `<span class="vv">${g.v}</span>` : "";
    if (mode==="start") return `<p class="vp">${vv}${startWord(g.items.map(([x])=>x.t).join(" "), g.items[0][1])}</p>`;
    const body = g.items.map(([x,i])=>{
      if (mode==="hide") return `<span class="cover rest" role="button" tabindex="0" aria-label="${i+1}번째 부분 열기">${esc(x.t)}</span>`;
      return esc(x.t);
    }).join(" ");
    return `<p class="vp">${vv}${body}</p>`;
  }).join("") + `</div>`;
}
function fixNote(r){
  if (!r.fx.length && !r.rf) return "";
  const items = r.fx.map(([a,b])=> a&&b ? `<li><s>${esc(a)}</s> → <b>${esc(b)}</b></li>` : a ? `<li><s>${esc(a)}</s> 삭제</li>` : `<li><b>${esc(b)}</b> 추가</li>`);
  if (r.rf) items.unshift(`<li>${esc(r.rf)}</li>`);
  return `<details class="fix"><summary>개역개정에 맞게 고친 곳 ${items.length}</summary><ul>${items.join("")}</ul></details>`;
}
function memPool(){
  const t = document.querySelector('input[name="mt"]:checked').value, f = document.querySelector('input[name="mf"]:checked').value;
  return MEM.filter(r => (t==="all"||r.t===t) && (f!=="past"||r.y) && (f!=="todo"||memrec[r.id]!==1));
}
function renderMem(){
  const done = MEM.filter(r=>memrec[r.id]===1).length, past = MEM.filter(r=>r.y).length;
  $("m-stats").innerHTML = `<div class="stat"><b>${MEM.length}</b><span>암송 구절</span></div><div class="stat"><b>${done}</b><span>외운 구절</span></div><div class="stat"><b>${past}</b><span>기출 구절</span></div>`;
  $("m-mode").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.m===mui.mode));
  $("m-modehint").textContent = MODEHINT[mui.mode];
  $("m-rnd").textContent = mui.rnd ? "무작위" : "순서대로"; $("m-rnd").setAttribute("aria-pressed", mui.rnd);
  const list = memPool(); let h = "", sec = "";
  for (const r of list){
    const k = r.t + r.book; if (k!==sec){ sec=k; h += `<div class="vsec">${r.t==="ot"?"구약":"신약"} · ${esc(r.book)}</div>`; }
    h += `<article class="verseitem" data-id="${r.id}"><div class="vhead"><span class="vref">${esc(r.ref)}</span><span class="vnum">${r.t==="ot"?"구약":"신약"} ${r.s}-${r.n}</span>`+
      `<button class="mark" aria-pressed="${memrec[r.id]===1}">${memrec[r.id]===1?"외웠음 ✓":"외웠어요"}</button></div>` +
      vlines(r, mui.mode) + fixNote(r) + `</article>`;
  }
  $("m-list").innerHTML = h || `<p class="muted">조건에 맞는 구절이 없습니다.</p>`;
  $("m-go").disabled = !list.length;
  $("m-go").textContent = list.length ? `${list.length}구절 카드로 외우기` : "구절 없음";
}
$("m-list").addEventListener("click", e=>{
  const c = e.target.closest(".cover"); if (c){ c.classList.add("open"); c.disabled = true; return; }
  const m = e.target.closest(".mark"); if (m){ const id = m.closest(".verseitem").dataset.id;
    memrec[id] = memrec[id]===1 ? 0 : 1; store.set("mem",memrec); renderMem(); }
});
$("m-mode").onclick = e=>{ const b=e.target.closest("button"); if(!b) return; mui.mode=b.dataset.m; store.set("mui",mui); renderMem(); };
document.querySelectorAll('#mem input[type="radio"]').forEach(r=>r.onchange=renderMem);
$("m-rnd").onclick = ()=>{ mui.rnd=!mui.rnd; store.set("mui",mui); renderMem(); };

document.addEventListener("keydown", e=>{ const c = e.target.closest && e.target.closest("span.cover"); if (c && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); c.click(); } });
let csess = null, cstep = 0;
$("m-go").onclick = ()=>{ let ids = memPool().map(r=>r.id); if (mui.rnd) ids = shuffle(ids); csess = {ids, i:0}; show("card"); renderCard(); };
function renderCard(){
  const r = MEM.find(x=>x.id===csess.ids[csess.i]); cstep = 0;
  $("c-pos").textContent = `${csess.i+1} / ${csess.ids.length}`;
  $("c-prog").style.width = (csess.i/csess.ids.length*100)+"%";
  $("c-prev").style.visibility = csess.i ? "visible" : "hidden";
  $("c-body").innerHTML = `<div class="meta"><span class="badge plain">${r.t==="ot"?"구약":"신약"} ${r.s}-${r.n}</span>${memrec[r.id]===0?'<span class="badge red">다시 볼 구절</span>':""}</div>
    <div class="cardref">${esc(r.ref)}</div><div class="cue">${esc(r.cue)} …</div>
    <div id="c-text">${vlines(r,"start")}</div><div id="c-extra"></div>`;
  $("c-body").querySelectorAll(".cover").forEach(c=>c.onclick=()=>{ c.classList.add("open"); c.disabled=true; cardState(r); });
  cardState(r); window.scrollTo(0,0);
}
function cardState(r){
  const left = $("c-body").querySelectorAll(".cover:not(.open)").length;
  if (!left){
    $("c-extra").innerHTML = (r.tip?`<div class="tip"><b>외우는 요령</b>${r.tip.map(esc).join("<br>")}</div>`:"") + fixNote(r);
    $("c-act").innerHTML = `<button class="btn nob" id="c-no">다시 볼래요</button><button class="btn okb" id="c-ok">외웠어요</button>`;
    $("c-ok").onclick=()=>markNext(r,1); $("c-no").onclick=()=>markNext(r,0);
  } else {
    $("c-act").innerHTML = `<button class="btn" id="c-line">조금 더 열기</button><button class="btn primary" id="c-showall">전체 보기</button>`;
    $("c-line").onclick=()=>{ const c=$("c-body").querySelector(".cover:not(.open)"); c.classList.add("open"); c.disabled=true; cardState(r); };
    $("c-showall").onclick=()=>{ $("c-body").querySelectorAll(".cover").forEach(c=>{c.classList.add("open"); c.disabled=true;}); cardState(r); };
  }
}
function markNext(r,v){
  memrec[r.id]=v; store.set("mem",memrec);
  if (++csess.i >= csess.ids.length){ show("mem"); return; }
  renderCard();
}
$("c-prev").onclick = ()=>{ if(csess.i>0){ csess.i--; renderCard(); } };
$("c-home").onclick = ()=>show("mem");
document.addEventListener("keydown", e=>{
  if ($("card").hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key===" "||e.key==="Enter"){ const b=$("c-line")||$("c-ok"); if(b){ e.preventDefault(); b.click(); } }
});

show(ui.view==="mem" ? "mem" : ui.view==="study" ? "study" : "home");
</script>

</body></html>
